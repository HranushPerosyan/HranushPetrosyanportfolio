<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#222321">

  <title>Hranush Petrosyan | Web Designer & Web Developer</title>
  <meta name="description" content="Portfolio of Hranush Petrosyan, Web Designer and Web Developer specializing in Shopify, responsive websites, front-end development, and back-end integrations.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --charcoal: #222321;
      --charcoal-light: #30312d;
      --ivory: #f5f1e8;
      --ivory-dark: #e8e1d5;
      --bronze: #b18a5b;
      --bronze-light: #d0b28b;
      --text-muted: #aaa69d;
      --border: rgba(177, 138, 91, 0.25);
      --font-heading: "Manrope", sans-serif;
      --font-body: "DM Sans", sans-serif;
      --container: 1180px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: var(--font-body);
      background: var(--charcoal);
      color: var(--ivory);
      line-height: 1.7;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--bronze);
      color: var(--charcoal);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(var(--container), calc(100% - 48px));
      margin-inline: auto;
    }

    .section {
      padding: 112px 0;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--bronze-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .section-label::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--bronze);
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: clamp(34px, 4.6vw, 54px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -2px;
    }

    .section-title span {
      color: var(--bronze-light);
    }

    .section-description {
      max-width: 600px;
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 22px;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(34, 35, 33, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(245, 241, 232, 0.07);
    }

    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.7px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--bronze-light);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #c8c4bb;
      font-size: 12px;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--bronze-light);
    }

    .nav-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--bronze);
      padding: 11px 19px;
      color: var(--ivory);
      font-size: 12px;
      font-weight: 600;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .nav-contact:hover {
      background: var(--bronze);
      color: var(--charcoal);
    }

    /* HERO */

    .hero {
      position: relative;
      min-height: 690px;
      display: flex;
      align-items: center;
      padding: 85px 0 100px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -160px;
      right: -160px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: rgba(177, 138, 91, 0.07);
      filter: blur(70px);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 75px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      color: var(--bronze-light);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bronze-light);
      box-shadow: 0 0 12px rgba(208, 178, 139, 0.55);
    }

    .hero h1 {
      max-width: 720px;
      font-family: var(--font-heading);
      font-size: clamp(48px, 6.5vw, 78px);
      line-height: 1.04;
      letter-spacing: -4px;
      font-weight: 600;
    }

    .hero h1 span {
      color: var(--bronze-light);
    }

    .hero-subtitle {
      margin-top: 25px;
      color: #d0ccc3;
      font-size: 17px;
      font-weight: 500;
    }

    .hero-description {
      max-width: 510px;
      margin-top: 15px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.95;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 35px;
    }

    .button {
      min-height: 49px;
      padding: 13px 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .button-primary {
      background: var(--bronze);
      color: var(--charcoal);
      border: 1px solid var(--bronze);
    }

    .button-primary:hover {
      background: var(--bronze-light);
      border-color: var(--bronze-light);
    }

    .button-outline {
      border: 1px solid rgba(245, 241, 232, 0.25);
      color: var(--ivory);
    }

    .button-outline:hover {
      border-color: var(--bronze);
      color: var(--bronze-light);
    }

    .hero-visual {
      position: relative;
      width: 100%;
      max-width: 410px;
      justify-self: end;
      padding: 14px 14px 0 0;
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      inset: 30px 0 -14px 30px;
      border: 1px solid var(--bronze);
      pointer-events: none;
    }

    .hero-photo {
      position: relative;
      width: 100%;
      height: 490px;
      object-fit: cover;
      object-position: center 35%;
      background: var(--charcoal-light);
      filter: saturate(0.82);
    }

    /* SKILLS STRIP */

    .skills-strip {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #272824;
      padding: 24px 0;
    }

    .skills-strip-inner {
      display: flex;
